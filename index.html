<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

<div class="calculator">

    <div class="left-side">

        <div id="display"></div>

        <div class="keys">

            <div class="keypad">
                <button class="key">^</button>
                <button class="key">(</button>
                <button class="key">)</button>
                <button class="key">7</button>
                <button class="key">8</button>
                <button class="key">9</button>
                <button class="key">4</button>
                <button class="key">5</button>
                <button class="key">6</button>
                <button class="key">1</button>
                <button class="key">2</button>
                <button class="key">3</button>
                <button class="key">0</button>
                <button class="key">.</button>
                <button class="key">%</button>
            </div>

            <div class="operators">
                <button class="key">/</button>
                <button class="key">*</button>
                <button class="key">-</button>
                <button class="key">+</button>
                <button id="equals">=</button>
            </div>

        </div>
    </div>

    <div class="dpad">
        <button id="up" class="up-down" title="Older history">&#8743;</button>
        <div class="middle">
            <button id="left" class="arrow" title="Move cursor left">&lt;</button>
            <button id="clear" class="clr">CLR</button>
            <button id="right" class="arrow" title="Move cursor right">&gt;</button>
        </div>
        <button id="down" class="up-down" title="Newer history">&#8744;</button>
    </div>

</div>

<script src="index.js"></script>
</body>
</html>
